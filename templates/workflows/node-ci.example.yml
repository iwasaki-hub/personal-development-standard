# EXAMPLE ONLY — adapt and move to .github/workflows/node-ci.yml
# Requires package.json + package-lock.json and the relevant scripts.
name: Node CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run test --if-present
      - run: npm run build --if-present
# IMPORTANT: Replace test command with the actual framework command.
# Missing scripts are skipped; define mandatory checks and verify they run.
