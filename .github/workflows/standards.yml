name: Standards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: standards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate standard files
        run: bash scripts/validate-standards.sh
      - name: Test bootstrap and GitHub protection
        run: python3 -m unittest discover -s tests -v
